# Separate VPWEM variant; privileged labels are supervision, never policy inputs.
task:
  env_id: ShellGameShuffleTouchCustom-VLA-v0
  dataset_dir: data_mikasa_robo/data_npz/shell_game_shuffle_touch_custom_vla_v0_swaps1_2_tracking_v1
  max_episode_steps: 60

model:
  # Preserve the brief cue and all cups; do not crop away the tracking target.
  crop_height: 128
  crop_width: 128
  random_crop: false
  memory_subsample_ratio: 1
  memory_cache_strategy: fifo

tracking:
  attention_heads: 4
  hidden_dim: 128
  loss_weight: 1.0
  prefix_loss_weight: 0.5
  hidden_phase_weight: 2.0
  xy_scale: 0.25
  unroll_steps: 8

train:
  output_dir: outputs/shell_game_shuffle_touch_tracking
  batch_size: 4
  compile_model: false
